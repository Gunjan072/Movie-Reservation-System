{% extends 'base.html' %}

{% block title %}Forgot Password – CineReserve{% endblock %}

{% block content %}
<div class="container-xl py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card bg-dark border-secondary shadow-lg rounded-4 p-4 text-center">
                <div class="d-inline-flex p-3 rounded-circle bg-danger text-white mx-auto mb-3 shadow">
                    <i class="bi bi-shield-lock-fill fs-3"></i>
                </div>
                <h3 class="fw-bold text-light mb-2">Reset Password</h3>
                <p class="text-secondary small mb-4">Enter your registered email address and we will generate a secure reset link.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4 text-start">
                        <label class="form-label text-light small fw-bold">Registered Email</label>
                        {{ form.email }}
                    </div>
                    <button type="submit" class="btn btn-cinema-primary w-100 py-2">
                        Generate Reset Link
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top border-secondary text-secondary small">
                    <a href="{% url 'accounts:login' %}" class="text-danger text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
